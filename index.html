<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>慌慌｜歌曲查詢</title>
  <meta name="description" content="以 Google 試算表同步的歌曲查詢網站，可依歌名、歌手快速搜尋。" />
  <link rel="preconnect" href="https://docs.google.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="hero" aria-label="網站標題">
      <div>
        <p class="eyebrow">Morandi Blue Song Finder</p>
        <h1>慌慌歌曲查詢</h1>
        <p class="subtitle">輸入歌名或歌手，即可快速篩選 Google 試算表中的歌曲。</p>
      </div>
      <div class="hero-card">
        <span id="songCount" class="count">0</span>
        <span class="count-label">首歌曲</span>
        <small id="updatedAt">尚未同步</small>
      </div>
    </section>

    <section class="toolbar" aria-label="搜尋工具">
      <label class="search-box">
        <span>搜尋</span>
        <input id="searchInput" type="search" placeholder="例：聽海、A-Lin、鄧紫棋" autocomplete="off" />
      </label>
      <select id="artistFilter" aria-label="歌手篩選">
        <option value="">全部歌手</option>
      </select>
      <button id="clearBtn" type="button">清除</button>
    </section>

    <section class="status" id="statusBox" role="status">正在同步歌單資料…</section>

    <section class="result-head">
      <h2>查詢結果</h2>
      <p id="resultText">載入中</p>
    </section>

    <section id="songList" class="song-grid" aria-live="polite"></section>
  </main>

  <template id="songCardTemplate">
    <article class="song-card">
      <div class="song-main">
        <h3 class="song-title"></h3>
        <p class="song-artist"></p>
      </div>
      <button class="copy-btn" type="button">複製</button>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
